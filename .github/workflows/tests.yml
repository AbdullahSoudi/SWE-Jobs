name: Offline regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run isolated Python regression suite
        run: python -B ops/run_tests.py
      - name: Test free Cloudflare scheduler
        run: node --test deploy/cloudflare-scheduler/test/scheduler.test.mjs
      - name: Check installer syntax and configuration contract
        run: |
          bash -n deploy/install_systemd.sh
          bash tests/test_install_systemd.sh
