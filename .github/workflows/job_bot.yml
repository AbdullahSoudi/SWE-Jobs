name: Programming Jobs Bot

on:
  schedule:
    - cron: '7,22,37,52 * * * *'  # Every 15 minutes, offset from top-of-hour load
  workflow_dispatch:  # Manual trigger.
    inputs:
      seed_mode:
        description: 'Store fetched jobs without sending them'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

concurrency:
  group: programming-jobs-bot
  cancel-in-progress: false

jobs:
  run-bot:
    # After VPS cutover set repository variable VPS_PRODUCTION=true. Scheduled
    # GitHub runs then stop, while workflow_dispatch remains available for
    # diagnostics or one-off seed runs.
    if: github.event_name == 'workflow_dispatch' || vars.VPS_PRODUCTION != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore SQLite database from data branch
        run: |
          # Fetch only the current data-branch tip. The data branch contains a
          # binary SQLite snapshot on every commit, so fetching its full history
          # becomes very expensive over time.
          git fetch --depth=1 origin data || true

          if git checkout origin/data -- jobs.db 2>/dev/null; then
            echo "jobs.db restored: $(wc -c < jobs.db) bytes"
          else
            echo "jobs.db not found yet; db.py will create it during the first run."
          fi

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          # Once VPS is production, manual Actions runs are forced to seed mode
          # so a stale data-branch copy can never double-send Telegram jobs.
          SEED_MODE: ${{ vars.VPS_PRODUCTION == 'true' && 'true' || (github.event.inputs.seed_mode || 'false') }}
          # Active primary topic Thread IDs (one Telegram post per job)
          TOPIC_GENERAL: ${{ secrets.TOPIC_GENERAL }}
          TOPIC_BACKEND: ${{ secrets.TOPIC_BACKEND }}
          TOPIC_FRONTEND: ${{ secrets.TOPIC_FRONTEND }}
          TOPIC_MOBILE: ${{ secrets.TOPIC_MOBILE }}
          TOPIC_DEVOPS: ${{ secrets.TOPIC_DEVOPS }}
          TOPIC_QA: ${{ secrets.TOPIC_QA }}
          TOPIC_AI_ML: ${{ secrets.TOPIC_AI_ML }}
          TOPIC_CYBERSECURITY: ${{ secrets.TOPIC_CYBERSECURITY }}
          TOPIC_INTERNSHIPS: ${{ secrets.TOPIC_INTERNSHIPS }}
          TOPIC_ERP: ${{ secrets.TOPIC_ERP }}
        run: python main.py

      - name: Save SQLite database to data branch
        if: always()
        run: |
          if [ ! -f jobs.db ]; then
            echo "jobs.db was not created; nothing to persist."
            exit 0
          fi

          mkdir -p /tmp/job-bot-data
          cp jobs.db /tmp/job-bot-data/jobs.db

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The restore step already fetched origin/data shallowly. Reuse that
          # exact tip instead of downloading the growing binary history again.
          git checkout -B data origin/data 2>/dev/null || git checkout --orphan data

          # Remove the old JSON persistence file if it exists from previous versions.
          git rm -f seen_jobs.json 2>/dev/null || true

          cp /tmp/job-bot-data/jobs.db jobs.db
          git add jobs.db

          git diff --cached --quiet && echo "No SQLite database changes to commit" || {
            git commit -m "Update bot SQLite database [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
            git push origin data
          }
